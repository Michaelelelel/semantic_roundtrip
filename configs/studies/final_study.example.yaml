schema_version: 1

study:
  name: final_semantic_roundtrip_study
  output_directory: results

# Copy this file into a study directory as study.yaml. Replace each placeholder
# with the child-run directory printed by its Spark A or Spark B job.
conditions:
  system_legacy:
    run: ../REPLACE_SPARK_A_JOB/runs/REPLACE_SYSTEM_LEGACY_RUN
    label: Legacy system
  system_intermediate:
    run: ../REPLACE_SPARK_A_JOB/runs/REPLACE_SYSTEM_INTERMEDIATE_RUN
    label: Intermediate system
  anchor_current:
    run: ../REPLACE_SPARK_A_JOB/runs/REPLACE_ANCHOR_SPARK_A_RUN
    label: Current anchor

  image_sd15:
    run: ../REPLACE_SPARK_A_JOB/runs/REPLACE_IMAGE_SD15_RUN
    label: Stable Diffusion 1.5
  image_sdxl:
    run: ../REPLACE_SPARK_A_JOB/runs/REPLACE_IMAGE_SDXL_RUN
    label: SDXL Base 1.0
  image_sd35:
    run: ../REPLACE_SPARK_A_JOB/runs/REPLACE_IMAGE_SD35_RUN
    label: Stable Diffusion 3.5 Large

  prompt_mistral7:
    run: ../REPLACE_SPARK_B_JOB/runs/REPLACE_PROMPT_MISTRAL7_RUN
    label: Mistral 7B
  prompt_mistral24:
    run: ../REPLACE_SPARK_B_JOB/runs/REPLACE_PROMPT_MISTRAL24_RUN
    label: Mistral Small 24B
  prompt_qwen30:
    run: ../REPLACE_SPARK_B_JOB/runs/REPLACE_PROMPT_QWEN30_RUN
    label: Qwen3 30B-A3B
  prompt_gemma4_gemma_reconstruction:
    run: ../REPLACE_SPARK_B_JOB/runs/REPLACE_PROMPT_GEMMA4_GEMMA_RUN
    label: Gemma prompt / Gemma reconstruction
  family_gemma_prompt_qwen_reconstruction:
    run: ../REPLACE_SPARK_B_JOB/runs/REPLACE_FAMILY_GEMMA_QWEN_RUN
    label: Gemma prompt / Qwen reconstruction

  reconstruction_llava:
    run: ../REPLACE_SPARK_B_JOB/runs/REPLACE_RECONSTRUCTION_LLAVA_RUN
    label: LLaVA 1.5 7B
  reconstruction_qwen25:
    run: ../REPLACE_SPARK_B_JOB/runs/REPLACE_RECONSTRUCTION_QWEN25_RUN
    label: Qwen2.5-VL 7B
  reconstruction_qwen38:
    run: ../REPLACE_SPARK_B_JOB/runs/REPLACE_RECONSTRUCTION_QWEN38_RUN
    label: Qwen3.8 27B

groups:
  complete_systems:
    kind: accuracy
    conditions: [system_legacy, system_intermediate, anchor_current]

  prompt_models:
    kind: paired
    conditions:
      - prompt_mistral7
      - prompt_mistral24
      - prompt_qwen30
      - prompt_gemma4_gemma_reconstruction
      - anchor_current
    reference: anchor_current

  image_models:
    kind: paired
    conditions: [image_sd15, image_sdxl, image_sd35, anchor_current]
    reference: anchor_current

  reconstruction_models:
    kind: paired
    conditions:
      - reconstruction_llava
      - reconstruction_qwen25
      - reconstruction_qwen38
      - anchor_current
    reference: anchor_current

  complete_system_routes:
    kind: routes
    conditions: [system_legacy, system_intermediate, anchor_current]

  reconstruction_routes:
    kind: routes
    conditions:
      - reconstruction_llava
      - reconstruction_qwen25
      - reconstruction_qwen38
      - anchor_current

  qwen_family_match:
    kind: paired
    conditions: [anchor_current, reconstruction_qwen38]
    reference: anchor_current

  gemma_family_match:
    kind: paired
    conditions:
      - family_gemma_prompt_qwen_reconstruction
      - prompt_gemma4_gemma_reconstruction
    reference: family_gemma_prompt_qwen_reconstruction
