schema_version: 7

run:
  name: mock_smoke
  output_directory: runs

dataset:
  profile: ../datasets/mock_titles_v1.yaml

experiment:
  prompt_seeds:
    - 1000
    - 1001
  image_seeds:
    - 41
    - 42
  retry_limit: 0

backends:
  mock:
    profile: ../backends/mock.yaml

stages:
  prompt_generation:
    backend: mock
    prompt_profile: prompts/prompt_generation/visual_single_v1.yaml

  image_generation:
    backend: mock

  verification:
    backend: mock

  image_description:
    backend: mock
    template_path: prompts/image_description/plain_v1.txt

  title_guessing:
    direct:
      backend: mock
    from_description:
      backend: mock
      template_path: prompts/title_guessing/description_plain_v1.txt
