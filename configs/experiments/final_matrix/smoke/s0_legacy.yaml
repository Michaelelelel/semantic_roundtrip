schema_version: 6

run:
  name: dgx_matrix_s0_legacy_smoke
  output_directory: runs

dataset:
  dataset_id: dgx_matrix_smoke_v1
  items:
    - id: songs_imagine
      domain: songs
      title: Imagine

experiment:
  prompt_seeds:
    - 1000
  image_seeds:
    - 8566257
  retry_limit: 1

backends:
  prompt_llm:
    profile: ../../../backends/text/mistral-7b-instruct-v0.1-q4_k_m-llamacpp.yaml
  image_model:
    profile: ../../../backends/image/stable-diffusion-v1-5-comfyui.yaml
  verifier_vlm:
    profile: ../../../backends/vision/qwen3-vl-8b-instruct-q8_0-llamacpp.yaml
  title_vlm:
    profile: ../../../backends/vision/llava-v1.5-7b-q4_k-llamacpp.yaml

stages:
  prompt_generation:
    backend: prompt_llm
    prompt_profile: prompts/prompt_generation/visual_single_v3.yaml
    parameters:
      temperature: 0.7
      top_p: 0.95
      max_tokens: 512

  image_generation:
    backend: image_model

  verification:
    backend: verifier_vlm
    template_path: prompts/verification/json_v2.txt
    parameters:
      temperature: 0.0
      top_p: 1.0
      max_tokens: 128
      seed: 3001

  image_description:
    backend: title_vlm
    template_path: prompts/image_description/plain_v1.txt
    parameters:
      temperature: 0.0
      top_p: 1.0
      max_tokens: 512
      seed: 3002

  title_guessing:
    direct:
      backend: title_vlm
      template_path: prompts/title_guessing/plain_v1.txt
      parameters:
        temperature: 0.0
        top_p: 1.0
        max_tokens: 64
        seed: 3003
    from_description:
      backend: title_vlm
      template_path: prompts/title_guessing/description_plain_v1.txt
      parameters:
        temperature: 0.0
        top_p: 1.0
        max_tokens: 64
        seed: 3003
