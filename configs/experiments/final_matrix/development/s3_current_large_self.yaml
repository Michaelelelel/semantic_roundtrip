schema_version: 6

run:
  name: dgx_matrix_s3_current_large_development_self
  output_directory: runs

dataset:
  profile: ../../../datasets/development_titles_v1.yaml

experiment:
  prompt_seeds:
    - 1000
    - 1001
  image_seeds:
    - 8566257
    - 2875613
  retry_limit: 1

backends:
  prompt_llm:
    profile: ../../../backends/text/gpt-oss-120b-mxfp4-llamacpp.yaml
  image_model:
    profile: ../../../backends/image/qwen-image-2512-bf16-comfyui.yaml
  verifier_vlm:
    profile: ../../../backends/vision/qwen3-vl-8b-instruct-q8_0-llamacpp.yaml
  title_vlm:
    profile: ../../../backends/vision/qwen3.6-27b-q8_0-llamacpp.yaml

stages:
  prompt_generation:
    backend: prompt_llm
    prompt_profile: prompts/prompt_generation/visual_single_v3.yaml
    parameters:
      temperature: 1.0
      top_p: 1.0
      max_tokens: 4096

  image_generation:
    backend: image_model

  verification:
    backend: verifier_vlm
    template_path: prompts/verification/json_v2.txt
    parameters:
      temperature: 0.0
      top_p: 1.0
      max_tokens: 128
      seed: 3001

  image_description:
    backend: title_vlm
    template_path: prompts/image_description/plain_v1.txt
    parameters:
      temperature: 0.7
      top_p: 0.95
      max_tokens: 4096
      seed: 3002

  title_guessing:
    direct:
      backend: title_vlm
      template_path: prompts/title_guessing/plain_v1.txt
      parameters:
        temperature: 0.7
        top_p: 0.95
        max_tokens: 8192
        seed: 3003
    from_description:
      backend: title_vlm
      template_path: prompts/title_guessing/description_plain_v1.txt
      parameters:
        temperature: 0.7
        top_p: 0.95
        max_tokens: 8192
        seed: 3003
