schema_version: 3

run:
  name: dgx_smoke
  output_directory: runs

dataset:
  items:
    - domain: songs
      title: Imagine

experiment:
  prompts_per_title: 1
  prompt_seed: 1000
  image_seeds:
    - 8566257
  retry_limit: 1

backends:
  prompt_llm:
    profile: ../backends/text/mistral-7b-instruct-v0.1-q4_k_m-llamacpp.yaml
  image_model:
    profile: ../backends/image/stable-diffusion-v1-5-comfyui.yaml
  vision_llm:
    profile: ../backends/vision/llava-v1.5-7b-q4_k-llamacpp.yaml

stages:
  prompt_generation:
    backend: prompt_llm
    prompt_profile: prompts/prompt_generation/visual_single_v1.yaml
    parameters:
      temperature: 0.2
      top_p: 0.95
      max_tokens: 512

  image_generation:
    backend: image_model

  verification:
    backend: vision_llm
    template_path: prompts/verification/json_v1.txt
    parameters:
      max_tokens: 128

  title_guessing:
    direct:
      backend: vision_llm
      template_path: prompts/title_guessing/plain_v1.txt
      parameters:
        max_tokens: 64

evaluation:
  failed_verification: count_as_failure
