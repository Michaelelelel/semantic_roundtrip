schema_version: 1

run:
  name: mock_smoke
  output_directory: runs

dataset:
  items:
    - domain: songs
      title: Imagine
    - domain: movies
      title: The Matrix

experiment:
  prompts_per_title: 2
  prompt_seed: 1000
  image_seeds:
    - 42
  retry_limit: 0

backends:
  mock:
    profile: ../backends/mock.yaml

stages:
  prompt_generation:
    backend: mock
    prompt_profile: prompts/prompt_generation/visual_single_v1.yaml

  image_generation:
    backend: mock_error

  verification:
    backend: mock

  title_guessing:
    backend: mock

evaluation:
  failed_verification: count_as_failure
