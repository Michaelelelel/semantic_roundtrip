schema_version: 6

run:
  name: final_i0_sd15_direct
  output_directory: runs

dataset:
  profile: ../../datasets/proposed_final_titles_v1.yaml

experiment:
  prompt_seeds:
    - 1000
    - 1001
  image_seeds:
    - 8566257
    - 2875613
  retry_limit: 1

backends:
  prompt_model:
    profile: ../../backends/text/qwen3.6-27b-q8_0-llamacpp.yaml
  image_model:
    profile: ../../backends/image/stable-diffusion-v1-5-comfyui.yaml
  verifier:
    profile: ../../backends/vision/qwen3-vl-8b-instruct-q8_0-llamacpp.yaml
  reconstruction_model:
    profile: ../../backends/vision/qwen3.6-27b-q8_0-no-thinking-llamacpp.yaml

stages:
  prompt_generation:
    backend: prompt_model
    prompt_profile: prompts/prompt_generation/visual_single_v4.yaml
    parameters:
      temperature: 0.7
      top_p: 0.95
      max_tokens: 4096

  image_generation:
    backend: image_model

  verification:
    backend: verifier
    template_path: prompts/verification/json_v3.txt
    parameters:
      temperature: 0.0
      top_p: 1.0
      max_tokens: 128
      seed: 3001

  title_guessing:
    direct:
      backend: reconstruction_model
      template_path: prompts/title_guessing/plain_v3.txt
      parameters:
        temperature: 0.7
        top_p: 0.8
        max_tokens: 128
        seed: 3003
