schema_version: 10
run:
  name: direct_pg_q38_bi_q38_illustratable
  output_directory: runs
dataset:
  profile: ../../../datasets/development_illustratable_titles_v1.yaml
experiment:
  prompt_seeds:
  - 1000
  - 1001
  image_seeds:
  - 8566257
  - 2875613
  retry_limit: 1
backends:
  prompt_model:
    profile: ../../../backends/text/qwen3.8-27b-bf16-llamacpp.yaml
  image_model:
    profile: ../../../backends/image/stable-diffusion-3.5-large-bf16-comfyui.yaml
  verifier:
    profile: ../../../backends/vision/qwen3.8-27b-bf16-llamacpp.yaml
  reconstruction_model:
    profile: ../../../backends/vision/qwen3.8-27b-bf16-llamacpp.yaml
stages:
  prompt_generation:
    backend: prompt_model
    prompt_profile: prompts/prompt_generation/visual_single_v5.yaml
    parameters:
      temperature: 1.0
      top_k: 0
      top_p: 0.95
      min_p: 0.0
      repeat_penalty: 1.0
      presence_penalty: 0.0
      frequency_penalty: 0.0
      max_tokens: 512
  image_generation:
    backend: image_model
  verification:
    backend: verifier
    prompt:
      policy: reference_title_absent
    image:
      strict:
        prompt_profile: prompts/verification/json_v3.yaml
      title_aware:
        prompt_profile: prompts/verification/title_aware_json_v1.yaml
    parameters:
      temperature: 0.0
      top_k: 0
      top_p: 1.0
      min_p: 0.0
      repeat_penalty: 1.0
      presence_penalty: 0.0
      frequency_penalty: 0.0
      max_tokens: 512
      seed: 3001
  title_guessing:
    direct:
      backend: reconstruction_model
      prompt_profile: prompts/title_guessing/plain_v3.yaml
      parameters:
        temperature: 1.0
        top_k: 0
        top_p: 0.95
        min_p: 0.0
        repeat_penalty: 1.0
        presence_penalty: 0.0
        frequency_penalty: 0.0
        max_tokens: 128
        seed: 3003
