# Replace inherit.from_run with a current-schema development root run.
# The seeds must match that source; only Verification executes locally.
schema_version: 8
run:
  name: verification_q38_development_check
  output_directory: runs
experiment:
  prompt_seeds: [1000, 1001]
  image_seeds: [8566257, 2875613]
  retry_limit: 1
backends:
  verifier:
    profile: ../../../backends/vision/qwen3.8-27b-bf16-llamacpp.yaml
stages:
  verification:
    backend: verifier
    template_path: prompts/verification/json_v3.txt
    parameters:
      temperature: 0.0
      top_k: 0
      top_p: 1.0
      min_p: 0.0
      repeat_penalty: 1.0
      presence_penalty: 0.0
      frequency_penalty: 0.0
      max_tokens: 512
      seed: 3001
inherit:
  from_run: /REPLACE/WITH/SOURCE/RUN
  stages:
  - image_generation
