# Replace inherit.from_run with a completed current-schema run.
schema_version: 7
run:
  name: external_import_direct_smoke
  output_directory: runs
experiment:
  prompt_seeds:
  - 1000
  image_seeds:
  - 8566257
  retry_limit: 1
backends:
  reconstruction_model:
    profile: ../../../backends/vision/gemma-4-31b-it-bf16-llamacpp.yaml
stages:
