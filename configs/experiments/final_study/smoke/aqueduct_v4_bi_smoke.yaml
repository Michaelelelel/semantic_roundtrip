schema_version: 11
run:
  name: aqueduct_v4_bi_smoke
  output_directory: runs
dataset:
  dataset_id: final_study_smoke_v1
  items:
  - id: songs_imagine
    domain: songs
    title: Imagine
experiment:
  prompt_seeds:
  - 1000
  image_seeds:
  - 8566257
  retry_limit: 1
backends:
  mock:
    profile: ../../../backends/mock.yaml
  interpretation_model:
    profile: ../../../backends/text/deepseek-v4-flash-284b-aqueduct.yaml
stages:
  prompt_generation:
    backend: mock
    prompt_profile: prompts/prompt_generation/visual_single_v5.yaml
  image_generation:
    backend: mock
  verification_prompt:
    policy: reference_title_absent
  verification_image:
    backend: mock
    policies:
      strict:
        prompt_profile: prompts/verification/json_v3.yaml
      title_aware:
        prompt_profile: prompts/verification/title_aware_json_v1.yaml
    parameters: {}
  image_description:
    backend: mock
    prompt_profile: prompts/image_description/plain_v1.yaml
  title_guessing:
    from_description:
      backend: interpretation_model
      prompt_profile: prompts/title_guessing/description_plain_v3.yaml
      parameters:
        temperature: 1.0
        top_p: 0.95
        max_tokens: 32000
        seed: 3003
