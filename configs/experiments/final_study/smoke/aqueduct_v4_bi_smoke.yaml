schema_version: 9
run:
  name: aqueduct_v4_bi_smoke
  output_directory: runs
dataset:
  dataset_id: final_study_smoke_v1
  items:
  - id: songs_imagine
    domain: songs
    title: Imagine
experiment:
  prompt_seeds:
  - 1000
  image_seeds:
  - 8566257
  retry_limit: 1
backends:
  mock:
    profile: ../../../backends/mock.yaml
  interpretation_model:
    profile: ../../../backends/text/deepseek-v4-flash-284b-aqueduct.yaml
stages:
  prompt_generation:
    backend: mock
    prompt_profile: prompts/prompt_generation/visual_single_v5.yaml
  image_generation:
    backend: mock
  verification:
    backend: mock
    prompt:
      policy: reference_title_absent
    image:
      strict: {}
      title_aware: {}
  image_description:
    backend: mock
    template_path: prompts/image_description/plain_v1.txt
  title_guessing:
    from_description:
      backend: interpretation_model
      template_path: prompts/title_guessing/description_plain_v3.txt
      parameters:
        temperature: 1.0
        top_p: 0.95
        max_tokens: 32000
        seed: 3003
