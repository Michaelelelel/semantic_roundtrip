schema_version: 6
run: {name: smoke_image_sd35, output_directory: runs}
dataset:
  dataset_id: final_study_native_smoke_v1
  items: [{id: songs_imagine, domain: songs, title: Imagine}]
experiment:
  prompt_seeds: [1000]
  image_seeds: [8566257]
  retry_limit: 1
backends:
  prompt_model: {profile: ../../../backends/text/qwen3.8-27b-bf16-llamacpp.yaml}
  image_model: {profile: ../../../backends/image/stable-diffusion-3.5-large-bf16-comfyui.yaml}
  verifier: {profile: ../../../backends/vision/qwen2.5-vl-7b-instruct-f16-llamacpp.yaml}
  reconstruction_model: {profile: ../../../backends/vision/gemma-4-31b-it-bf16-llamacpp.yaml}
stages:
  prompt_generation:
    backend: prompt_model
    prompt_profile: prompts/prompt_generation/visual_single_v4.yaml
    parameters: {temperature: 0.7, top_p: 0.95, max_tokens: 1024}
  image_generation: {backend: image_model}
  verification:
    backend: verifier
    template_path: prompts/verification/json_v3.txt
    parameters: {temperature: 0.0, top_p: 1.0, max_tokens: 128, seed: 3001}
  title_guessing:
    direct:
      backend: reconstruction_model
      template_path: prompts/title_guessing/plain_v3.txt
      parameters: {temperature: 0.0, top_p: 1.0, max_tokens: 64, seed: 3003}

