schema_version: 2

run:
  name: mock_description
  output_directory: runs

dataset:
  items:
    - domain: songs
      title: Imagine

experiment:
  prompts_per_title: 1
  prompt_seed: 1000
  image_seeds:
    - 42
  retry_limit: 0

backends:
  mock:
    profile: ../backends/mock.yaml

stages:
  prompt_generation:
    backend: mock
    prompt_profile: prompts/prompt_generation/visual_single_v1.yaml

  image_generation:
    backend: mock

  verification:
    backend: mock
    template_path: prompts/verification/json_v1.txt

  image_description:
    backend: mock
    template_path: prompts/image_description/plain_v1.txt

  title_guessing:
    input: description
    backend: mock
    template_path: prompts/title_guessing/description_plain_v1.txt

evaluation:
  failed_verification: count_as_failure
