schema_version: 1

run:
  name: mock_pause
  output_directory: runs

dataset:
  items:
    - domain: songs
      title: Imagine
    - domain: movies
      title: The Matrix

experiment:
  prompts_per_title: 5
  prompt_seed: 1000
  image_seeds:
    - 41
    - 42
  retry_limit: 0

backends:
  mock:
    profile: ../backends/mock.yaml

stages:
  prompt_generation:
    backend: mock
    prompt_profile: prompts/prompt_generation/visual_single_v1.yaml
    parameters:
      delay_seconds: 2

  image_generation:
    backend: mock
    parameters:
      delay_seconds: 2

  verification:
    backend: mock
    parameters:
      delay_seconds: 2

  title_guessing:
    backend: mock
    parameters:
      delay_seconds: 2

evaluation:
  failed_verification: count_as_failure
