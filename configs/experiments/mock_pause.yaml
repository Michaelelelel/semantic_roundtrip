schema_version: 10

run:
  name: mock_pause
  output_directory: runs

dataset:
  dataset_id: mock_pause_v1
  items:
    - id: songs_imagine
      domain: songs
      title: Imagine

experiment:
  prompt_seeds:
    - 1000
    - 1001
  image_seeds:
    - 41
    - 42
  retry_limit: 0

backends:
  mock:
    profile: ../backends/mock.yaml

stages:
  prompt_generation:
    backend: mock
    prompt_profile: prompts/prompt_generation/visual_single_v5.yaml
    parameters:
      delay_seconds: 1

  image_generation:
    backend: mock
    parameters:
      delay_seconds: 1

  verification:
    backend: mock
    prompt:
      policy: reference_title_absent
    image:
      strict:
        prompt_profile: prompts/verification/json_v3.yaml
      title_aware:
        prompt_profile: prompts/verification/title_aware_json_v1.yaml
    parameters:
      delay_seconds: 1

  image_description:
    backend: mock
    prompt_profile: prompts/image_description/plain_v1.yaml
    parameters:
      delay_seconds: 1

  title_guessing:
    direct:
      backend: mock
      prompt_profile: prompts/title_guessing/plain_v3.yaml
      parameters:
        delay_seconds: 1
    from_description:
      backend: mock
      prompt_profile: prompts/title_guessing/description_plain_v3.yaml
      parameters:
        delay_seconds: 1
