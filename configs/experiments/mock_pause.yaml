run:
  name: mock_pause
  output_directory: runs

dataset:
  items:
    - domain: songs
      title: Imagine
    - domain: movies
      title: The Matrix

experiment:
  prompts_per_title: 5
  prompt_profile: prompts/prompt_generation/visual_single_v1.yaml
  image_seeds:
    - 41
    - 42
  retry_limit: 0

stages:
  prompt_generation:
    adapter: mock
    settings:
      delay_seconds: 2

  image_generation:
    adapter: mock
    settings:
      delay_seconds: 2

  verification:
    adapter: mock
    settings:
      delay_seconds: 2

  title_guessing:
    adapter: mock
    settings:
      delay_seconds: 2

evaluation:
  failed_verification: count_as_failure
