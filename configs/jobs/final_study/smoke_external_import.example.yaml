# Replace source_jobs.local_smoke.directory before running.
schema_version: 4
job:
  name: final_smoke_external_import
  output_directory: runs
  continue_on_error: true
source_jobs:
  local_smoke:
    directory: /REPLACE/WITH/FINAL_SMOKE_LOCAL_JOB
experiments:
- name: external_from_job_entry
  config: ../../experiments/final_study/smoke/external_import_direct.yaml
  inherit:
    from_job_entry:
      job: local_smoke
      entry: direct_pg_q25_bi_q25_smoke
    stages:
    - verification
