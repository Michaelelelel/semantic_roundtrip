services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    volumes:
      - "${MODEL_DIR}:/models:ro"
      - "./chat_templates:/chat_templates:ro"

    command:
      - -m
      - /models/${MODEL_FILE}
      - --alias
      - prompt-model
      - --jinja
      - --chat-template-file
      - /chat_templates/mistral-7b-instruct-v0.1.jinja
      - -c
      - "2048"
      - --host
      - 0.0.0.0
    ports:
      - "${API_PORT}:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  vlm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    ports:
      - "${VLM_PORT:-18182}:8080"
    volumes:
      - "${VLM_MODEL_DIR:-./models_vlm}:/models:ro"
    environment:
      LLAMA_MEDIA_MARKER: "<__media__>"
    command:
      - -m
      - /models/${VLM_MODEL_FILE:-ggml-model-q4_k.gguf}
      - --mmproj
      - /models/${VLM_MMPROJ_FILE:-mmproj-model-f16.gguf}
      - --chat-template
      - ${VLM_CHAT_TEMPLATE:-vicuna}
      - -c
      - "4096"
      - --host
      - 0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
  python_app:
    profiles: [ "experiment" ]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    build: .
    volumes:
      - .:/app
    depends_on:
      llama:
        condition: service_healthy
      vlm:
        condition: service_healthy
      comfyui:
        condition: service_healthy
    command:
      - semantic-roundtrip
      - run
      - --config
      - ${EXPERIMENT_CONFIG:-configs/experiments/dgx_smoke.yaml}

  comfyui:
    image: mmartial/comfyui-nvidia-docker:ubuntu24_cuda13.1-dgx-latest
    ports:
      - "${COMFYUI_PORT}:8188"
    volumes:
      - ./comfy_run:/comfy/mnt
      - ./basedir:/basedir
      - ${COMFYUI_MODEL_DIR:-./models}:/basedir/models
      - ./outputs:/basedir/output
    environment:
      WANTED_UID: "${HOST_UID:-1000}"
      WANTED_GID: "${HOST_GID:-1000}"
      BASE_DIRECTORY: /basedir
      SECURITY_LEVEL: normal
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8188/system_stats', timeout=4).read()
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 2m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
