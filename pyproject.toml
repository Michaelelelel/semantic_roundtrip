[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-roundtrip"
version = "0.1.0"
description = "A modular multimodal AI pipeline"
requires-python = ">=3.9"

dependencies = [
    "pydantic>=2",
    "PyYAML>=6",
    "requests>=2",
    "typer>=0.12",
    "rich>=13",
    "Pillow>=10"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5"
]

[project.scripts]
semantic-roundtrip = "semantic_roundtrip.cli:app"

[tool.setuptools.packages.find]
where = ["src"]