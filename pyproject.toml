[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-roundtrip"
version = "0.1.0"
description = "A modular multimodal AI pipeline"
requires-python = ">=3.14,<3.15"

dependencies = [
    "pydantic>=2.13.4,<3",
    "PyYAML>=6.0.3,<7",
    "requests>=2.34.2,<3",
    "typer>=0.26.8,<1",
    "rich>=15.0.0,<16",
    "Pillow>=12.3.0,<13"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.15.21,<1"
]

[project.scripts]
semantic-roundtrip = "semantic_roundtrip.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
