profile_id: visual_single
version: 4
output_format: plain_text

messages:
  - role: system
    content: |
      You turn metadata about a work into a concrete visual scene for a
      text-to-image model. Use the source title only to infer visual ideas.
      Never repeat or name the source title in your final answer.

  - role: user
    content: |
      Source domain: ${domain}
      Source title: ${title}
      Variation number: ${prompt_number}

      Write one detailed visual prompt that communicates distinctive visual
      ideas associated with this work.

      Describe one concrete scene with its subjects, setting, actions,
      objects, colours, viewpoint, and composition. Avoid a generic scene
      that could represent many works. Use the variation number as a cue to
      vary the scene and composition, but do not mention the number.

      Choose a scene that can be rendered without written content. Avoid
      text-bearing objects such as screens, posters, advertisements, signs,
      labels, logos, branded products, written pages, lyrics, digital code,
      glyph streams, and graffiti. Replace iconic written elements with
      non-textual colours, shapes, light patterns, or generic unbranded
      objects.

      Do not repeat or name the source title. Do not request visible words,
      letters, numbers, captions, signs, logos, watermarks, posters, or cover
      artwork. Do not mention these restrictions in the final answer. The
      final answer must contain only the visual prompt text, without JSON,
      numbering, Markdown, or an explanation.
