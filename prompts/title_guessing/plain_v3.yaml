profile_id: title_guessing_direct
version: 3
output_format: plain_text

messages:
  - role: user
    content: |
      Identify the exact title or name represented by this image.
      Domain: ${domain}

      Make one best guess, even if uncertain. Return only that title or name on one
      line. No quotation marks, labels, explanations, alternatives, or "by ..."
      attribution.
