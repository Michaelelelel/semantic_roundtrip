services:
  text_runtime:
    image: >-
      ghcr.io/ggml-org/llama.cpp:server-cuda13@sha256:a4e80bbbf4c8ce61816f5142e14e9f5e8fd8504d66e6fb7075adb6b41a15c66d
    volumes:
      - "${MODEL_ROOT:?MODEL_ROOT must be set}/text:/models:ro"
      - "${MODEL_ROOT:?MODEL_ROOT must be set}/multimodal:/multimodal:ro"
      - ./configs/deployments/text-models.ini:/config/models.ini:ro
    command:
      - --models-preset
      - /config/models.ini
      - --models-max
      - "1"
      - --no-models-autoload
      - --host
      - 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vision_runtime:
    image: >-
      ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:ea610f2c82d033b6765b24fa7c0ab15c267d564f883de7c494f1e3073d496374
    volumes:
      - "${MODEL_ROOT:?MODEL_ROOT must be set}/vision:/models:ro"
      - "${MODEL_ROOT:?MODEL_ROOT must be set}/multimodal:/multimodal:ro"
      - ./configs/deployments/vision-models.ini:/config/models.ini:ro
    command:
      - --models-preset
      - /config/models.ini
      - --models-max
      - "1"
      - --no-models-autoload
      - --host
      - 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  image_runtime:
    image: >-
      mmartial/comfyui-nvidia-docker:ubuntu24_cuda13.1-dgx-latest@sha256:35329a99d5e3b96afdd7f24b6b2b9ce71cb45552cf60a904787c2528101310ad
    volumes:
      - "${RUNTIME_ROOT:?RUNTIME_ROOT must be set}/comfyui/mnt:/comfy/mnt"
      - "${RUNTIME_ROOT:?RUNTIME_ROOT must be set}/comfyui/base:/basedir"
      - "${MODEL_ROOT:?MODEL_ROOT must be set}/image:/basedir/models"
    environment:
      WANTED_UID: "${HOST_UID:?HOST_UID must be set}"
      WANTED_GID: "${HOST_GID:?HOST_GID must be set}"
      BASE_DIRECTORY: /basedir
      SECURITY_LEVEL: normal
      USE_UV: "true"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8188/system_stats', timeout=4).read()
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 2m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
